name: CI
run-name: ${{ github.actor }} is testing out
on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          cache: "pnpm"
          node-version-file: ".node-version"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check package versions
        working-directory: packages/ts-nameof-proxy
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const npm = JSON.parse(readFileSync("package.json", "utf8"));
          const jsr = JSON.parse(readFileSync("jsr.json", "utf8"));
          assert.equal(jsr.version, npm.version, "npm and JSR versions must match");
          NODE

      - name: Check JSR publishing
        run: pnpm run check:jsr
